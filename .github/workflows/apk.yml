name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: APK derle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk NotDefteri.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NotDefteri-apk
          path: NotDefteri.apk
      - name: Sürüm yayınla (telefondan indirmek için)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v2.0.${{ github.run_number }}"
          gh release create "$TAG" NotDefteri.apk --title "Not Defteri $TAG" --notes "Telefonunuzdan NotDefteri.apk dosyasını indirip kurun." --latest
